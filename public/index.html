<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taigun - AI Support Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🤖 AI Support Assistant</h1>
                <p>Get instant AI-powered solutions to your IT problems</p>
            </div>
        </header>

        <main class="main-content">
            <!-- Problem Submission Form -->
            <section class="problem-section" id="problemSection">
                <div class="card">
                    <h2>Describe Your Problem</h2>
                    <form id="problemForm">
                        <div class="form-group">
                            <label for="problem">What issue are you experiencing?</label>
                            <textarea id="problem" name="problem" rows="6"
                                placeholder="Example: I can't connect to the VPN from home..." required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="userName">Your Name (Optional)</label>
                                <input type="text" id="userName" name="userName" placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="userEmail">Your Email (Optional)</label>
                                <input type="email" id="userEmail" name="userEmail" placeholder="john@company.com">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span class="btn-text">Get Solution</span>
                            <span class="btn-loader" style="display: none;">
                                <span class="spinner"></span> Analyzing...
                            </span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Solution Display -->
            <section class="solution-section" id="solutionSection" style="display: none;">
                <div class="card">
                    <div class="solution-header">
                        <h2>💡 Recommended Solution</h2>
                        <div class="confidence-badge" id="confidenceBadge"></div>
                    </div>

                    <div class="problem-summary" id="problemSummary"></div>

                    <div class="solution-steps" id="solutionSteps"></div>

                    <div class="similar-cases" id="similarCases" style="display: none;">
                        <h3>📚 Based on Similar Cases</h3>
                        <div id="similarCasesList"></div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="resetForm()">Submit Another Problem</button>
                        <button class="btn btn-outline" onclick="window.print()">Print Solution</button>
                    </div>
                </div>
            </section>

            <!-- Loading State -->
            <section class="loading-section" id="loadingSection" style="display: none;">
                <div class="card loading-card">
                    <div class="loading-animation">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring delay-1"></div>
                        <div class="pulse-ring delay-2"></div>
                    </div>
                    <h3>Analyzing Your Problem...</h3>
                    <p id="loadingStatus">Searching knowledge base and historical cases</p>
                </div>
            </section>

            <!-- Error Display -->
            <section class="error-section" id="errorSection" style="display: none;">
                <div class="card error-card">
                    <h3>⚠️ Something Went Wrong</h3>
                    <p id="errorMessage"></p>
                    <button class="btn btn-primary" onclick="resetForm()">Try Again</button>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Powered by AI • <a href="/admin">Admin Portal</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
